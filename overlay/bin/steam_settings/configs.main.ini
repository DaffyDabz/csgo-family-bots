[main::connectivity]
# gbe_fork Steam stand-in for srcds, STEAMCLIENT mode under the csgo_gc launcher
# (app id 4465480). It never contacts Steam; it talks only to the gbe stand-ins in
# the CS:GO clients on the LAN (P2P for csgo_gc inventories + the server
# browser list). offline=0 so the game server reports "logged on" (like the
# client chain); nothing leaves the LAN because gbe has no real Steam connection.
# listen_port 47594: WSL mirrored networking shares ports with this PC's Windows
# client stand-ins. Windows cannot bind 44620-48715 on this PC (WSL mirrored mode gives that range
# to Linux), so the stand-ins in clients ON THIS PC listen on 27584 (27586/27587 = test roots);
# custom_broadcasts.txt points at those (+1 each: the game loads the stand-in twice and the
# first copy keeps the listen port, so the live one sits on port+1). Other PCs (47584/47585)
# announce themselves to us via their own custom_broadcasts.txt.
disable_lan_only=0
disable_networking=0
listen_port=47594
offline=0
