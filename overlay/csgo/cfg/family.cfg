// Family CS:GO server settings - THE file to change (then: csgo-ctl.sh assemble,
// or edit /opt/csgo/server/csgo/cfg/family.cfg live and `csgo-ctl.sh cmd exec family`).
// Exec'd by server.cfg and by every gamemode_<mode>_server.cfg (those run after Valve's mode cfg and
// add only the per-mode bot count), so these values win in every mode.
// STEP 3 (2026-09-23): one party, one game. Players drop in: GO in the Play menu connects to this server;
// when nobody else is on, the family_party plugin (addons/) switches it to the chosen mode/map first.
// A joining human replaces a bot; everyone picks a team on the team-select screen ("Auto" = the party's
// team while it has a slot, else the other team, else spectate - done by the plugin).
hostname "Family CS:GO"
sv_lan 1

// bots: STEP 8 (2026-09-24) the family_party plugin's director picks named bots from our roster by elo
// (botprofile.db + addons/family_roster.txt, generated by servers/csgo/bots/make_botprofile.py) and sets
// bot_quota itself; gamemode_*_server.cfg start each level at bot_quota 0. A human who joins takes a bot's place.
bot_quota_mode fill
bot_difficulty 2              // only used if the engine ever adds a bot on its own (named adds ignore it)
bot_defer_to_human_goals 0    // bots plant / defuse / go for the bomb even with a human on their team (Valve's
                              // competitive + Wingman cfgs set 1: the kids' bot teammates never planted)
sv_auto_adjust_bot_difficulty 0          // no automatic bot swapping by contribution score (was 1)
bot_autodifficulty_threshold_high 20.0   // was 0.0 from Valve's mode cfgs; unused while the above is 0
bot_autodifficulty_threshold_low -20.0   // was -2.0
bot_join_after_player 0       // bots play while nobody is on
bot_auto_vacate 1             // a bot leaves a full team to make room for a human
bot_chatter off
// STEP 9 (2026-09-24): the plugin's bot brain (plugin/family_brain.cpp) plays the bots as teams - CT site holds and
// rotations, T group hits / lurker / post-plant, trades, team buys - scaled by each bot's elo. It reads the bots' money
// from the server log for the team buy call. Map points: addons/family_maps/<map>.txt (made by assemble.sh).
mp_logmoney 1
bot_eco_limit 0               // a bot buys whatever it can afford (a "force"); the brain's team call makes a smart team
                              // save together (eco) instead (Valve default 2000 = each bot saved on its own)

// server behaviour
sv_hibernate_when_empty 0     // never sleeps: the running game is always there to drop into
mp_autoteambalance 0          // players pick either team; nobody is moved
mp_limitteams 0
mp_autokick 0                 // nobody is kicked for standing still (kids wander off)
mp_force_pick_time 3600       // the game never forces a pick; after 45 s the family_party plugin applies "Auto"
mp_match_end_changelevel 0    // stay on the chosen map/mode:
mp_match_end_restart 1        // a finished match restarts on the same map
sv_pure 0
sv_allowupload 0
sv_allowdownload 0
sv_cheats 0
sv_alltalk 1
sv_deadtalk 1

// server log (csgo/logs): the family_party plugin reads match start, round end, scores, plants, defuses from it
log on
